{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentd.authSecretName" . }}
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "agentd.authSecretKey" . | quote }}: {{ required "auth.apiKey or auth.existingSecret is required" .Values.auth.apiKey | quote }}
{{- end }}

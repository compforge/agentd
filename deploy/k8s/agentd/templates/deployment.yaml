{{- if and (not .Values.database.dsn) (not .Values.database.mysql.enabled) }}
{{- fail "database.dsn or database.mysql.enabled is required because agentd and Agentlet share one database" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentd.fullname" . }}
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentd.selectorLabels" . | nindent 8 }}
        {{- with .Values.agentd.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agentd.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agentd.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agentd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AGENTD_WORKER_CAPACITY
              value: {{ .Values.worker.capacity | quote }}
            - name: AGENTD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentd.authSecretName" . }}
                  key: {{ required "auth.existingSecretKey is required" .Values.auth.existingSecretKey }}
            - name: AGENTD_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentd.databaseSecretName" . }}
                  key: dsn
            {{- with .Values.agentd.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8020
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: worker-template
              mountPath: /etc/agentd/worker-template
              readOnly: true
          resources:
            {{- toYaml .Values.agentd.resources | nindent 12 }}
      volumes:
        - name: worker-template
          configMap:
            name: {{ include "agentd.fullname" . }}-worker-template
      {{- with .Values.agentd.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

replicaCount: 1

image:
  repository: ghcr.io/compforge/agentd
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 8020

model:
  apiKey: ""
  baseURL: ""

database:
  # Set an external DSN to skip the built-in MySQL workload.
  dsn: ""
  mysql:
    enabled: true
    image:
      repository: mysql
      tag: "8.4"
      pullPolicy: IfNotPresent
    auth:
      database: agentd
      username: agentd
      password: agentd
      rootPassword: agentd-root
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources: {}

agentd:
  # Defaults come from agentd/config.go. Add only intentional overrides here.
  extraEnv: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  capacity: 1
  agentlet:
    image:
      repository: ghcr.io/compforge/agentlet
      tag: latest
      pullPolicy: IfNotPresent
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
  sandboxEngine:
    image:
      repository: ghcr.io/compforge/hostel
      tag: latest
      pullPolicy: IfNotPresent
    resources: {}
    securityContext: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

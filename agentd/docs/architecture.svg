<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">agentd control plane and workers</title>
  <desc id="desc">A client or SDK calls the agentd control plane. agentd persists durable state in a database and schedules sessions to workers of different capacities. The larger worker expands Agentlet, several agent harness executions, and the Sandbox Engine; the smaller worker shows the same workload in compact form.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 28px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 17px; fill: #4b5563; }
      .label { font-size: 18px; font-weight: 600; }
      .box { fill: #f1f5fb; stroke: #111827; stroke-width: 3.5; }
      .inner { fill: #ffffff; stroke: #111827; stroke-width: 2.8; }
      .accent { fill: #f3edfb; stroke: #111827; stroke-width: 2.8; }
      .flow { fill: none; stroke: #111827; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #111827; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- Client -->
  <rect x="45" y="205" width="250" height="165" rx="17" class="box"/>
  <text x="170" y="266" text-anchor="middle" class="title">Client</text>
  <text x="170" y="310" text-anchor="middle" class="body">Claude SDK</text>
  <text x="170" y="343" text-anchor="middle" class="small">Session · Event</text>

  <!-- agentd control plane -->
  <rect x="430" y="155" width="330" height="265" rx="17" class="box"/>
  <text x="595" y="221" text-anchor="middle" class="title">agentd</text>
  <text x="595" y="263" text-anchor="middle" class="body">Control Plane</text>
  <line x1="470" y1="291" x2="720" y2="291" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <text x="595" y="332" text-anchor="middle" class="small">API · schedule · observe</text>
  <text x="595" y="367" text-anchor="middle" class="small">scale · route</text>

  <path d="M 295 287 H 430" class="flow"/>
  <rect x="322" y="258" width="80" height="31" rx="7" fill="#ffffff"/>
  <text x="362" y="281" text-anchor="middle" class="label">API</text>

  <!-- Durable database -->
  <path d="M 595 420 V 520" class="flow"/>
  <text x="614" y="480" class="label">persist</text>
  <rect x="450" y="535" width="290" height="150" rx="17" class="accent"/>
  <text x="595" y="589" text-anchor="middle" class="title">Control DB</text>
  <text x="595" y="628" text-anchor="middle" class="body">Agent · Session</text>
  <text x="595" y="658" text-anchor="middle" class="small">Worker · Assignment</text>

  <!-- Placement fan-out -->
  <path d="M 760 287 H 835" class="branch"/>
  <path d="M 835 190 V 490" class="branch"/>
  <path d="M 835 190 H 905" class="flow"/>
  <path d="M 835 490 H 1020" class="flow"/>
  <rect x="767" y="251" width="136" height="32" rx="7" fill="#ffffff"/>
  <text x="835" y="274" text-anchor="middle" class="label">assign / route</text>

  <!-- Larger worker: expanded details -->
  <rect x="915" y="45" width="440" height="360" rx="18" class="box"/>
  <text x="950" y="96" class="title">Worker</text>
  <text x="950" y="127" class="small">Agentlet workload · larger capacity</text>

  <rect x="950" y="155" width="245" height="210" rx="14" class="inner"/>
  <text x="975" y="196" class="body">Agentlet</text>
  <text x="975" y="225" class="small">Harness adapter</text>

  <rect x="975" y="247" width="195" height="43" rx="11" fill="#e8f4ff" stroke="#111827" stroke-width="2.2"/>
  <text x="1072" y="275" text-anchor="middle" class="small">Agent / Harness</text>
  <rect x="975" y="304" width="195" height="43" rx="11" fill="#e8f4ff" stroke="#111827" stroke-width="2.2"/>
  <text x="1072" y="332" text-anchor="middle" class="small">Agent / Harness</text>

  <rect x="1220" y="155" width="105" height="210" rx="14" fill="#fff7e8" stroke="#111827" stroke-width="2.8"/>
  <text x="1272" y="215" text-anchor="middle" class="body">Sandbox</text>
  <text x="1272" y="247" text-anchor="middle" class="body">Engine</text>
  <text x="1272" y="303" text-anchor="middle" class="small">Hostel</text>

  <path d="M 1195 267 H 1220" class="flow"/>
  <text x="1207" y="249" text-anchor="middle" class="small">tools</text>

  <!-- Smaller worker: same shape, compact capacity -->
  <rect x="1030" y="440" width="325" height="180" rx="18" class="box"/>
  <text x="1060" y="490" class="title">Worker</text>
  <text x="1060" y="521" class="small">smaller capacity</text>
  <rect x="1060" y="545" width="185" height="45" rx="11" class="inner"/>
  <text x="1152" y="574" text-anchor="middle" class="small">Agent / Harness</text>
  <rect x="1260" y="545" width="65" height="45" rx="11" fill="#fff7e8" stroke="#111827" stroke-width="2.2"/>
  <text x="1292" y="574" text-anchor="middle" class="small">SE</text>

  <text x="45" y="725" class="small">Session identity is durable; Worker compute can be released and recreated.</text>
</svg>

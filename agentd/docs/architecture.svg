<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">agentd managed agent architecture</title>
  <desc id="desc">agentd keeps durable managed-agent identity and control state, schedules elastic Worker Pods, and routes sessions to Agentlet. Each Worker Pod contains Agentlet, a pluggable harness, and a Sandbox Engine. Agent Ledger stores checkpoints and append-only execution facts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: -0.5px; }
      .subtitle { font-size: 16px; fill: #536079; }
      .section-title { font-size: 19px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .label { font-size: 12px; font-weight: 650; fill: #475569; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .flow-slate { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow-slate); }
      .flow-dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Managed Agent: durable identity, elastic execution</text>
  <text x="60" y="86" class="subtitle">agentd assembles the control plane, execution workers, harness, sandbox, and durable recovery data.</text>

  <!-- API client -->
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="230" height="118" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <text x="85" y="193" class="box-title">Client / Claude SDK</text>
  <text x="85" y="221" class="body">Agent · Environment</text>
  <text x="85" y="244" class="body">Session · Event · SSE</text>

  <!-- agentd control plane -->
  <g filter="url(#shadow)">
    <rect x="340" y="120" width="1040" height="328" rx="22" fill="#eef5ff" stroke="#93b4ef" stroke-width="2"/>
  </g>
  <text x="375" y="158" class="section-title">agentd · Control Plane</text>
  <text x="375" y="181" class="small">Public API, durable product identity, scheduling, observation, and routing</text>

  <rect x="380" y="210" width="250" height="96" rx="14" fill="#ffffff" stroke="#a8c3f3" stroke-width="1.5"/>
  <text x="405" y="244" class="box-title">Managed Agents API</text>
  <text x="405" y="270" class="body">Claude-compatible surface</text>
  <text x="405" y="290" class="small">Hertz · public endpoint</text>

  <rect x="660" y="210" width="320" height="96" rx="14" fill="#ffffff" stroke="#a8c3f3" stroke-width="1.5"/>
  <text x="685" y="244" class="box-title">Resources &amp; Control State</text>
  <text x="685" y="270" class="body">Agent · Environment · Session · Event</text>
  <text x="685" y="290" class="small">stable identity independent of compute</text>

  <rect x="1010" y="210" width="330" height="184" rx="14" fill="#ffffff" stroke="#a8c3f3" stroke-width="1.5"/>
  <text x="1035" y="244" class="box-title">Worker control</text>
  <text x="1035" y="272" class="body">Scheduler</text>
  <text x="1168" y="272" class="body">Lifecycler</text>
  <text x="1035" y="300" class="body">Observer</text>
  <text x="1168" y="300" class="body">Garbage Collector</text>
  <line x1="1035" y1="318" x2="1315" y2="318" stroke="#d7e3f7"/>
  <text x="1035" y="347" class="box-title">Connector</text>
  <text x="1035" y="372" class="small">routes an Assignment to Agentlet</text>

  <rect x="660" y="332" width="320" height="76" rx="14" fill="#dceaff" stroke="#8db2f0" stroke-width="1.5"/>
  <text x="685" y="362" class="box-title">Control DB</text>
  <text x="685" y="387" class="body">Workers · Assignments · resume point</text>

  <path d="M 285 214 H 380" class="flow-blue"/>
  <text x="299" y="201" class="label">HTTPS + SSE</text>
  <path d="M 630 258 H 660" class="flow-blue"/>
  <path d="M 820 306 V 332" class="flow-blue"/>
  <path d="M 980 258 H 1010" class="flow-blue"/>

  <!-- Worker pool -->
  <g filter="url(#shadow)">
    <rect x="340" y="492" width="770" height="338" rx="22" fill="#ecfdf5" stroke="#74c9a7" stroke-width="2"/>
  </g>
  <text x="375" y="530" class="section-title">Elastic Worker Pool</text>
  <text x="375" y="553" class="small">A Worker is Agentlet's workload form; on Kubernetes it is a Pod that can be created, drained, and released.</text>

  <text x="1130" y="530" class="section-title">Services &amp; durable data</text>
  <text x="1130" y="553" class="small">Kept outside the Worker lifecycle</text>

  <rect x="385" y="580" width="700" height="205" rx="18" fill="#ffffff" stroke="#8ed1b2" stroke-width="1.5"/>
  <text x="412" y="612" class="box-title">Worker Pod · Agentlet workload</text>

  <rect x="415" y="635" width="420" height="116" rx="13" fill="#e8f7ff" stroke="#8bc5e6" stroke-width="1.5"/>
  <text x="438" y="665" class="box-title">Agentlet</text>
  <text x="438" y="691" class="body">Internal API → Work service → Harness adapter</text>
  <rect x="438" y="710" width="170" height="25" rx="7" fill="#cdefff"/>
  <text x="453" y="728" class="small">AgentGo · first harness</text>

  <rect x="860" y="635" width="195" height="116" rx="13" fill="#fff7e8" stroke="#efbc6c" stroke-width="1.5"/>
  <text x="883" y="665" class="box-title">Sandbox Engine</text>
  <text x="883" y="691" class="body">files · commands</text>
  <text x="883" y="714" class="body">isolated workspace</text>
  <text x="883" y="737" class="small">Hostel · first engine</text>

  <rect x="1130" y="580" width="205" height="82" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1153" y="613" class="box-title">Model Provider</text>
  <text x="1153" y="639" class="body">model calls &amp; streams</text>

  <rect x="1130" y="695" width="205" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1153" y="727" class="box-title">Agent Ledger</text>
  <text x="1153" y="751" class="body">checkpoints + facts</text>
  <text x="1153" y="772" class="small">recovery · audit · trajectory</text>

  <path d="M 1175 394 V 456 H 625 V 635" class="flow-blue"/>
  <text x="758" y="477" class="label">Assignment + internal execution API</text>
  <path d="M 1185 394 V 468 H 1040 V 492" class="flow-slate flow-dashed"/>
  <text x="1100" y="459" class="label">observe / scale / GC</text>
  <path d="M 835 693 H 860" class="flow-green"/>
  <text x="839" y="682" class="label">tools</text>
  <path d="M 608 722 C 930 722 900 621 1130 621" class="flow-green"/>
  <text x="918" y="635" class="label">model calls</text>
  <path d="M 608 735 C 860 810 970 740 1130 740" class="flow-slate"/>
  <text x="824" y="786" class="label">checkpoint + append-only facts</text>

  <!-- Design invariant -->
  <rect x="55" y="842" width="1325" height="38" rx="11" fill="#e2e8f0"/>
  <circle cx="80" cy="861" r="6" fill="#2563eb"/>
  <text x="96" y="866" class="label">Durable:</text>
  <text x="155" y="866" class="body">Agent / Environment / Session / Event</text>
  <circle cx="520" cy="861" r="6" fill="#059669"/>
  <text x="536" y="866" class="label">Releasable:</text>
  <text x="621" y="866" class="body">Worker / Harness runtime / Sandbox</text>
  <text x="1005" y="866" class="small">One Session may resume on another Worker.</text>
</svg>

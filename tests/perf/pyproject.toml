[project]
name = "agentd-perf"
version = "0.1.0"
description = "Managed Agent system performance workloads for agentd"
requires-python = ">=3.10"
dependencies = [
    "case-harness",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentd_perf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
case-harness = { git = "https://github.com/compforge/case-harness", subdirectory = "python" }

[tool.ruff]
line-length = 100
target-version = "py310"

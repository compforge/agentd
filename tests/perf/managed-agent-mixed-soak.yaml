name: agentd-managed-agent-mixed-soak
extensions: [agentd_perf.managed_agent]
strict_slo: true

subject:
  name: agentd
  base_url: http://127.0.0.1:8020
  headers:
    x-api-key: test
    anthropic-beta: managed-agents-2026-04-01
  k8s:
    kubeconfig: ~/.kube/REPLACE_WITH_TARGET
    namespace: agentd
    app_label: app.kubernetes.io/name=agentd

resources:
  - {}

workload:
  name: managed_agent
  model: claude-sonnet-4-6
  pool_size: 10
  timeout_s: 180
  poll_interval_s: 0.5
  use_sandbox_tools: true

caseset: ./cases/turn.yaml
cases:
  - {id: plain_turn, weight: 4}
  - {id: sandbox_turn, weight: 1}

load:
  model: open
  max_inflight: 10
  graceful_stop_s: 180
  abort_on_error_rate: 0.05
  breaker_min_n: 20
  stages:
    - {name: ramp-0.1, ramp_to: 0.1, over_s: 60}
    - {name: hold-0.1, hold: 0.1, for_s: 600}

observe:
  - name: agentd
    probes: [top, restart, limits, pods]
  - name: worker
    k8s:
      kubeconfig: ~/.kube/REPLACE_WITH_TARGET
      namespace: agentd
      app_label: app.kubernetes.io/name=agentlet
    probes: [top, restart, limits, pods]

slo:
  - {metric: request.error_rate.value, lt: 0.01}
  - {metric: request.drop_rate.value, lte: 0}
  - {metric: accept_ms.p95, lt: 1000}
  - {metric: 'request.error_rate{turn_kind="plain"}.value', lt: 0.01}
  - {metric: 'request.error_rate{turn_kind="sandbox"}.value', lt: 0.01}
  - {metric: 'complete_ms{turn_kind="plain"}.p95', lt: 120000}
  - {metric: 'complete_ms{turn_kind="sandbox"}.p95', lt: 180000}
  - {metric: 'restart.restarts{service="agentd"}.increase', lte: 0}
  - {metric: 'restart.restarts{service="worker"}.increase', lte: 0}

observe_interval_s: 5
cooldown_s: 60
runs_dir: ./runs

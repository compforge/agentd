name: agentd-managed-agent-scale-out
extensions: [agentd_perf.managed_agent]
strict_slo: true

subject:
  name: agentd
  base_url: http://127.0.0.1:8020
  headers:
    x-api-key: test
    anthropic-beta: managed-agents-2026-04-01
  k8s:
    kubeconfig: ~/.kube/REPLACE_WITH_TARGET
    namespace: agentd
    app_label: app.kubernetes.io/name=agentd

resources:
  - {}

workload:
  name: managed_agent
  model: claude-sonnet-4-6
  pool_size: 8
  timeout_s: 180
  poll_interval_s: 0.5
  use_sandbox_tools: false

caseset: ./cases/turn.yaml
cases:
  - {id: plain_turn, weight: 1}

load:
  model: closed
  pacing: {kind: constant, secs: 1}
  graceful_stop_s: 180
  abort_on_error_rate: 0.05
  breaker_min_n: 8
  stages:
    - {name: ramp-1, ramp_to: 1, over_s: 10}
    - {name: hold-1, hold: 1, for_s: 60}
    - {name: ramp-4, ramp_to: 4, over_s: 15}
    - {name: hold-4, hold: 4, for_s: 120}
    - {name: ramp-8, ramp_to: 8, over_s: 15}
    - {name: hold-8, hold: 8, for_s: 120}

observe:
  - name: agentd
    probes: [top, restart, limits, pods]
  - name: worker
    k8s:
      kubeconfig: ~/.kube/REPLACE_WITH_TARGET
      namespace: agentd
      app_label: app.kubernetes.io/name=agentlet
    probes: [top, restart, limits, pods]

slo:
  - {metric: request.error_rate.value, lt: 0.01}
  - {metric: request.drop_rate.value, lte: 0}
  - {metric: accept_ms.p95, lt: 1000}
  - {metric: 'complete_ms{turn_kind="plain"}.p95', lt: 180000}
  - {metric: request.error_rate.value, window: {kind: hold, name: hold-1}, lt: 0.01}
  - {metric: request.error_rate.value, window: {kind: hold, name: hold-4}, lt: 0.01}
  - {metric: request.error_rate.value, window: {kind: hold, name: hold-8}, lt: 0.01}
  - {metric: 'restart.restarts{service="agentd"}.increase', lte: 0}
  - {metric: 'restart.restarts{service="worker"}.increase', lte: 0}
  - metric: 'pods.count{service="worker",state="total"}.last'
    lte: 1
    window: {kind: cooldown}

observe_interval_s: 5
cooldown_s: 660
runs_dir: ./runs

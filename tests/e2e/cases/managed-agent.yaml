caseset: agentd-managed-agent
focus: Managed Agent resource security and durable tool-using Session continuity.
schema_version: 1
facets:
  boundary: {values: [control-plane, system]}
  recovery: {values: [checkpoint, worker-replacement, mid-turn, graceful-drain, control-plane-restart]}
  fault_window: {values: [before-dispatch, during-turn]}
  security: {values: [authentication, credential]}
cases:
  - id: api_key_authentication
    desc: Public APIs reject missing and invalid keys while accepting the configured deployment key.
    input: {operation: get-models-with-missing-wrong-and-correct-api-key}
    facets: {boundary: control-plane, security: authentication}
    judge:
      e2e:
        assert:
          - {path: missing_status, op: eq, value: 401}
          - {path: wrong_status, op: eq, value: 401}
          - {path: correct_status, op: eq, value: 200}
    binding:
      symbol_id: agentd/internal/api/middleware/api_key.go::APIKey.Handle
      spec: Every public API requires the configured x-api-key while health remains anonymous.
  - id: model_secret_redaction
    desc: Model credentials remain write-only across create, get, and list.
    input: {operation: register-get-list-model}
    facets: {boundary: control-plane, security: credential}
    judge:
      e2e:
        assert:
          - {path: "responses[].id", op: not_empty}
          - {path: "responses[].api_key_configured", op: eq, value: true}
    binding:
      symbol_id: agentd/internal/api/models.go::modelResponse
      spec: Model credentials are write-only; public responses expose only whether a key is configured.
  - id: sandbox_resume
    desc: One managed Session completes two isolated tool turns from its durable checkpoint.
    input: {operation: two-sandbox-turns, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: checkpoint}
    judge:
      e2e:
        assert:
          - {path: agent_messages, op: gte, value: 2}
          - {path: "turns[].marker", op: eq, value: AGENTD_E2E_OK}
    binding:
      symbol_id: agentlet/internal/harness/agentgo.go::AgentGoRunner.Run
      spec: Each turn restores the latest validated Session checkpoint and executes tools through its Sandbox.
  - id: worker_replacement_resume
    desc: One managed Session resumes on a new logical Worker after its old Worker Pods disappear.
    input: {operation: replace-worker-between-sandbox-turns, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: worker-replacement}
    judge:
      e2e:
        assert:
          - {path: agent_messages, op: gte, value: 2}
          - {path: replacement_worker_id, op: not_in, value_path: previous_worker_ids}
          - {path: "turns[].marker", op: eq, value: AGENTD_E2E_OK}
    binding:
      symbol_id: agentd/internal/session/reconciler/reconciler.go::Reconciler.Reconcile
      spec: Confirmed Worker loss changes placement while durable Session input resumes from its checkpoint.
  - id: mid_turn_worker_loss
    desc: A running managed Session converges safely after its Worker is force-deleted.
    input: {operation: force-delete-worker-during-running-turn, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: mid-turn}
    judge:
      e2e:
        assert:
          - {path: user_messages, op: eq, value: 1}
          - {path: agent_messages, op: eq, value: 1}
          - {path: replacement_worker_id, op: not_in, value_path: previous_worker_ids}
          - {path: safe_outcome, op: eq, value: true}
    binding:
      symbol_id: agentd/internal/session/reconciler/reconciler.go::Reconciler.Reconcile
      spec: Running input survives Worker loss; uncertain side effects require exact reconciliation instead of automatic replay.
  - id: agentlet_graceful_drain
    desc: A running managed Session remains recoverable when its Worker receives normal Pod termination.
    input: {operation: delete-worker-during-running-turn, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: graceful-drain}
    judge:
      e2e:
        assert:
          - {path: user_messages, op: eq, value: 1}
          - {path: agent_messages, op: eq, value: 1}
          - {path: replacement_worker_id, op: not_in, value_path: previous_worker_ids}
          - {path: safe_outcome, op: eq, value: true}
    binding:
      symbol_id: agentlet/internal/service/service.go::Service.Shutdown
      spec: Process termination drains accepted Work or leaves its durable input recoverable after the grace deadline.
  - id: control_plane_restart_before_dispatch
    desc: Durable ingress converges after the single Control Plane Pod is replaced immediately after acceptance.
    input: {operation: restart-control-plane-after-ingress-before-dispatch, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: control-plane-restart, fault_window: before-dispatch}
    judge:
      e2e:
        assert:
          - {path: user_messages, op: eq, value: 1}
          - {path: agent_messages, op: eq, value: 1}
          - {path: control_plane_replaced, op: eq, value: true}
    binding:
      symbol_id: agentd/internal/session/reconciler/reconciler.go::Reconciler.Reconcile
      spec: Durable Session demand is rediscovered after notification loss or Control Plane restart.
  - id: control_plane_restart_during_turn
    desc: A running Agentlet finishes its Turn while the single Control Plane Pod is replaced.
    input: {operation: restart-control-plane-during-running-turn, expected_marker: AGENTD_E2E_OK}
    facets: {boundary: system, recovery: control-plane-restart, fault_window: during-turn}
    judge:
      e2e:
        assert:
          - {path: user_messages, op: eq, value: 1}
          - {path: agent_messages, op: eq, value: 1}
          - {path: control_plane_replaced, op: eq, value: true}
          - {path: worker_set_stable, op: eq, value: true}
    binding:
      symbol_id: agentd/internal/session/reconciler/reconciler.go::Reconciler.Reconcile
      spec: Agentlet execution remains independent while a replacement Control Plane rebuilds observation from shared state.
